<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Book of the Dead in 3D</title>
  <style>
    :root {
      --bg: #0a0c10;
      --card: #12161f;
      --accent: #e5b842;
      --text: #f0f6fc;
      --muted: #94a3b8;
      --border: rgba(255,255,255,0.12);
      --banner: #3b2a0a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100%; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); background: rgba(18,22,31,0.94); position: sticky; top: 0; z-index: 10; }
    h1 { font-size: 1rem; margin: 0; font-weight: 600; }
    a { color: var(--accent); }
    select { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 6px 8px; max-width: min(420px, 70vw); }
    .nav { display: flex; gap: 12px; align-items: center; }
    .banner { background: var(--banner); color: #fde68a; padding: 10px 16px; font-size: 0.92rem; border-bottom: 1px solid #854d0e; }
    main { padding: 16px; display: grid; gap: 16px; }
    .stage { min-height: 420px; background: #000; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; position: relative; }
    canvas.view { width: 100%; height: 480px; display: block; }
    iframe.embed { width: 100%; height: 480px; border: 0; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .credit { font-size: 0.85rem; color: var(--muted); padding: 0 16px 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #1e293b; color: var(--accent); font-size: 0.75rem; }
    .counts { color: var(--muted); font-size: 0.9rem; }
    .pdf a.button { display: inline-block; margin-top: 8px; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>The Book of the Dead in 3D</h1>
    <div class="nav">
      <label>Object
        <select id="picker"></select>
      </label>
      <a href="?page=status">Status</a>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="app"></main>
  <p id="credit" class="credit"></p>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    const DEFAULT_ID = "pahma-5-522";

    function params() {
      const q = new URLSearchParams(location.search);
      const path = location.pathname.replace(/\/+$/, "");
      return {
        status: path.endsWith("/status") || q.get("page") === "status",
        object: q.get("object") || DEFAULT_ID,
      };
    }

    async function loadJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status} ${url}`);
      return res.json();
    }

    function setBanner(text) {
      const el = document.getElementById("banner");
      if (!text) { el.hidden = true; el.textContent = ""; return; }
      el.hidden = false;
      el.textContent = text;
    }

    function setCredit(text) {
      document.getElementById("credit").textContent = text || "";
    }

    function fillPicker(objects, selected) {
      const sel = document.getElementById("picker");
      sel.innerHTML = objects.map((o) =>
        `<option value="${o.id}" ${o.id === selected ? "selected" : ""}>${o.title} (${o.delivery})</option>`
      ).join("");
      sel.onchange = () => {
        location.search = `?object=${encodeURIComponent(sel.value)}`;
      };
    }

    function countsRow(reg) {
      const c = reg.deliveryCounts || {};
      return `${c.annotated || 0} annotated · ${c.mesh || 0} mesh · ${c.embed || 0} embed · ${c.pdf || 0} pdf`;
    }

    function renderStatus(reg) {
      document.title = "Corpus status";
      setBanner("");
      setCredit("Bags listed are the closed sources the pipeline read.");
      const rows = reg.objects.map((o) => `
        <tr>
          <td><a href="?object=${encodeURIComponent(o.id)}">${o.id}</a></td>
          <td>${o.museum || ""}</td>
          <td><span class="pill">${o.delivery}</span></td>
          <td>${o.regions ?? ""}</td>
          <td>${o.phrases ?? ""}</td>
          <td>${o.lexicon ?? ""}</td>
          <td>${o.bag || ""}</td>
        </tr>`).join("");
      document.getElementById("app").innerHTML = `
        <div class="card">
          <h2>Corpus status</h2>
          <p class="counts">${countsRow(reg)} (= ${reg.objects.length})</p>
          <table>
            <thead><tr><th>id</th><th>museum</th><th>class</th><th>regions</th><th>phrases</th><th>lexicon</th><th>bag</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    async function renderMesh(container, objUrl) {
      const THREE = await import("three");
      const { OBJLoader } = await import("three/addons/loaders/OBJLoader.js");
      const { MTLLoader } = await import("three/addons/loaders/MTLLoader.js");
      const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
      const canvas = document.createElement("canvas");
      canvas.className = "view";
      container.appendChild(canvas);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000000);
      const camera = new THREE.PerspectiveCamera(45, 2, 0.01, 2000);
      camera.position.set(0, 0.2, 1.4);
      const controls = new OrbitControls(camera, renderer.domElement);
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const key = new THREE.DirectionalLight(0xffffff, 1.1);
      key.position.set(2, 3, 4);
      scene.add(key);
      const base = objUrl.replace(/[^/]+$/, "");
      const mtlUrl = objUrl.replace(/\.obj$/i, ".mtl");
      try {
        const materials = await new MTLLoader().setResourcePath(base).loadAsync(mtlUrl);
        materials.preload();
        const obj = await new OBJLoader().setMaterials(materials).loadAsync(objUrl);
        scene.add(obj);
      } catch {
        const obj = await new OBJLoader().loadAsync(objUrl);
        scene.add(obj);
      }
      function frame() {
        const w = canvas.clientWidth || 640;
        const h = canvas.clientHeight || 480;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }
      frame();
    }

    function epigraphyHTML(bundle) {
      const sections = bundle.epigraphy?.textSections || [];
      const phrases = Object.keys(bundle.epigraphy?.phrases || {}).length;
      const lex = bundle.lexicon?.total || 0;
      const regions = Object.keys(bundle.spatialAnnotations || {}).length;
      const body = sections.slice(0, 8).map((s) => {
        const frags = (s.fragments || []).slice(0, 3).map((f) =>
          `<div>${f.transliteration || ""} — ${f.translation || ""}</div>`
        ).join("");
        return `<section><h3>${s.title || s.id}</h3>${frags}</section>`;
      }).join("");
      return `<div class="card">
        <p class="counts">${regions} regions · ${phrases} phrases · ${lex} lexicon</p>
        ${body || "<p>No epigraphy text sections in the HTML parse.</p>"}
      </div>`;
    }

    async function renderObject(reg, id) {
      const meta = reg.objects.find((o) => o.id === id) || reg.objects[0];
      const bundle = await loadJSON(`data/objects/${meta.id}/bundle.json`);
      document.title = bundle.metadata.title;
      fillPicker(reg.objects, meta.id);
      setBanner(bundle.status || "");
      setCredit(bundle.narrative?.copyright || meta.credit || "");
      const app = document.getElementById("app");
      const delivery = bundle.delivery;
      let stage = `<div class="stage" id="stage"></div>`;
      if (delivery === "pdf") {
        const files = (bundle.model3D.pdfFilenames || []).join(", ") || "3D-PDF";
        stage = `<div class="card pdf">
          <h2>${bundle.metadata.title}</h2>
          <p>3D-PDF only; U3D not yet extracted. File: ${files}</p>
          <a class="button" href="data/objects/${meta.id}/bundle.json">Bundle JSON</a>
        </div>`;
      }
      if (delivery === "embed") {
        const src = bundle.model3D.sketchfabEmbed;
        stage = `<div class="stage"><iframe class="embed" title="${bundle.metadata.title}" src="${src}" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe></div>`;
      }
      app.innerHTML = `${stage}
        <div class="card">
          <h2>${bundle.metadata.title}</h2>
          <p><span class="pill">${delivery}</span> ${bundle.metadata.museum || ""} ${bundle.metadata.accession || ""}</p>
          <p>${(bundle.narrative?.summary || "").slice(0, 800)}</p>
        </div>
        ${delivery === "annotated" ? epigraphyHTML(bundle) : ""}`;
      if ((delivery === "annotated" || delivery === "mesh") && bundle.model3D.obj) {
        await renderMesh(document.getElementById("stage"), `data/objects/${meta.id}/${bundle.model3D.obj}`);
      }
    }

    async function main() {
      const reg = await loadJSON("data/objects.json");
      const p = params();
      fillPicker(reg.objects, p.object);
      if (p.status) {
        renderStatus(reg);
        return;
      }
      await renderObject(reg, p.object);
    }

    main().catch((err) => {
      document.getElementById("app").innerHTML = `<div class="card"><p>Failed to load corpus: ${err.message}</p></div>`;
    });
  </script>
</body>
</html>
